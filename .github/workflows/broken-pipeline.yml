name: CI Pipeline - Broken Pipeline Fixed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cấp quyền đọc mã nguồn và đẩy Docker Image lên GitHub Container Registry (ghcr.io)
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Gradle Tests & Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt môi trường JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # =========================================================================
      # KHẮC PHỤC LỖI 1 (Permission Denied):
      # [Trước khi sửa]: Gọi trực tiếp ./gradlew khi chưa có quyền thực thi -> Lỗi:
      # '/home/runner/work/_temp/xxx.sh: line 1: ./gradlew: Permission denied' (Exit Code 126).
      # [Sau khi sửa]: Thêm bước 'chmod +x gradlew' trước khi chạy tác vụ kiểm thử.
      # =========================================================================
      - name: Cấp quyền thực thi cho Gradle Wrapper (Fix Lỗi 1)
        run: chmod +x gradlew

      - name: Thực thi kiểm thử JUnit & Đóng gói tệp JAR
        run: ./gradlew clean test bootJar --no-daemon

      - name: Lưu trữ tệp JAR (Artifact) cho Job tiếp theo
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  docker-build:
    name: Build and Push Docker Image
    needs: test # RÀNG BUỘC PHỤ THUỘC: Chỉ thực thi khi Job test vượt qua thành công
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Tải về tệp JAR đã đóng gói từ Job test
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================================================================
      # KHẮC PHỤC LỖI 2 (Authentication Failed):
      # [Trước khi sửa]: Truyền sai tên biến secret (ví dụ: ${{ secrets.REGISTY_TOKEN }}
      # hoặc ${{ secrets.DOCKER_PASSWORD }}) khiến giá trị bị rỗng -> Lỗi:
      # 'Error: Username and password required' hoặc '401 Unauthorized'.
      # [Sau khi sửa]: Chuẩn hóa chính xác tên secret ${{ secrets.REGISTRY_TOKEN }}.
      # =========================================================================
      - name: Đăng nhập vào Docker Registry (Fix Lỗi 2)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Trích xuất siêu dữ liệu Docker (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # =========================================================================
      # KHẮC PHỤC LỖI 3 (Build Context Error):
      # [Trước khi sửa]: Cấu hình context hoặc file sai đường dẫn (ví dụ: context: ./src
      # hoặc file: ./docker/Dockerfile) -> Lỗi:
      # 'ERROR: failed to solve: failed to read dockerfile: open Dockerfile: no such file or directory'.
      # [Sau khi sửa]: Cấu hình context: . và file: ./Dockerfile chuẩn xác theo vị trí file gốc.
      # =========================================================================
      - name: Đóng gói và đẩy Docker Image lên Registry (Fix Lỗi 3)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
